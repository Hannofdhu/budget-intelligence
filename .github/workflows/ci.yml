name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Scale tests budget each solver stage independently; retain the complete
    # suite instead of terminating valid multi-stage work at 30 minutes.
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: budget
          POSTGRES_USER: budget
          POSTGRES_PASSWORD: budget
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budget -d budget"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      BUDGET_ENVIRONMENT: test
      BUDGET_AUTH_MODE: dev_headers
      BUDGET_DATABASE_URL: postgresql+asyncpg://budget:budget@127.0.0.1:5432/budget
      BUDGET_RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python-setup
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        id: node-setup
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
          registry-url: https://registry.npmjs.org
      - name: Install uv
        id: uv-install
        if: ${{ !cancelled() && steps.python-setup.outcome == 'success' }}
        run: python -m pip install uv==0.11.26
      - name: Install Python dependencies
        id: python-dependencies
        if: ${{ !cancelled() && steps.uv-install.outcome == 'success' }}
        run: uv sync --extra dev --frozen
      - name: Verify migrations
        id: migrations
        if: ${{ !cancelled() && steps.python-dependencies.outcome == 'success' }}
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      # Independent gates still fail the job, but one failure no longer hides
      # the remaining checks. Do not add continue-on-error to these steps.
      - name: Lint Python
        if: ${{ !cancelled() && steps.python-dependencies.outcome == 'success' }}
        run: uv run ruff check apps packages migrations tests
      - name: Check Python formatting
        if: ${{ !cancelled() && steps.python-dependencies.outcome == 'success' }}
        run: uv run ruff format --check apps packages migrations tests
      - name: Typecheck Python including tests
        if: ${{ !cancelled() && steps.python-dependencies.outcome == 'success' }}
        run: uv run mypy apps packages tests
      - name: Run Python and PostgreSQL tests
        id: python-tests
        if: ${{ !cancelled() && steps.migrations.outcome == 'success' }}
        run: uv run pytest --junitxml=output/acceptance/pytest.xml -o junit_family=xunit1
      - name: Derive acceptance from executed tests
        if: ${{ !cancelled() && hashFiles('output/acceptance/pytest.xml') != '' }}
        run: uv run python analysis/report_acceptance.py --junit output/acceptance/pytest.xml
      - name: Upload test and acceptance evidence
        if: ${{ !cancelled() && hashFiles('output/acceptance/pytest.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-execution
          path: output/acceptance/
      - name: Audit Python dependencies
        if: ${{ !cancelled() && steps.python-dependencies.outcome == 'success' }}
        run: uv run pip-audit --timeout 60
      - name: Install Web dependencies
        id: web-dependencies
        if: ${{ !cancelled() && steps.node-setup.outcome == 'success' }}
        working-directory: apps/web
        run: npm ci --registry=https://registry.npmjs.org
      - name: Build and typecheck Web
        if: ${{ !cancelled() && steps.web-dependencies.outcome == 'success' }}
        working-directory: apps/web
        run: npm run build
      - name: Run Web tests
        if: ${{ !cancelled() && steps.web-dependencies.outcome == 'success' }}
        working-directory: apps/web
        run: npm test
      - name: Audit Web dependencies
        if: ${{ !cancelled() && steps.web-dependencies.outcome == 'success' }}
        working-directory: apps/web
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org
      - name: Validate documentation
        if: ${{ !cancelled() && steps.node-setup.outcome == 'success' }}
        run: node analysis/validate_documentation.mjs
