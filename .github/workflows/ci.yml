name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: budget
          POSTGRES_USER: budget
          POSTGRES_PASSWORD: budget
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budget -d budget"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      BUDGET_ENVIRONMENT: test
      BUDGET_AUTH_MODE: dev_headers
      BUDGET_DATABASE_URL: postgresql+asyncpg://budget:budget@127.0.0.1:5432/budget
      BUDGET_RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install uv
        run: python -m pip install uv==0.11.26
      - name: Install Python dependencies
        run: uv sync --extra dev --frozen
      - name: Verify migrations
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Verify Python
        run: |
          uv run ruff check apps packages migrations tests
          uv run ruff format --check apps packages migrations tests
          uv run mypy apps packages tests
          uv run pytest --junitxml=output/acceptance/pytest.xml -o junit_family=xunit1
      - name: Derive acceptance from executed tests
        if: always()
        run: uv run python analysis/report_acceptance.py --junit output/acceptance/pytest.xml
      - name: Upload test and acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-execution
          path: output/acceptance/
      - name: Audit Python dependencies
        run: uv run pip-audit
      - name: Install and verify Web
        working-directory: apps/web
        run: |
          npm ci
          npm run build
          npm audit --audit-level=high
      - name: Validate documentation
        run: node analysis/validate_documentation.mjs
