name: budget-intelligence

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: budget
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: budget
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d budget"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - budget-postgres-data:/var/lib/postgresql/data

  api:
    profiles: ["app"]
    image: budget-intelligence-api:local
    build:
      context: .
      target: api
    environment:
      BUDGET_ENVIRONMENT: local
      BUDGET_AUTH_MODE: dev_headers
      BUDGET_API_HOST: 0.0.0.0
      BUDGET_DATABASE_URL: postgresql+asyncpg://budget:budget@postgres:5432/budget
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    profiles: ["app"]
    image: budget-intelligence-worker:local
    build:
      context: .
      target: worker
    environment:
      BUDGET_ENVIRONMENT: local
      BUDGET_AUTH_MODE: dev_headers
      BUDGET_DATABASE_URL: postgresql+asyncpg://budget:budget@postgres:5432/budget
      BUDGET_WORKER_ID: compose-worker-1
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: ["app"]
    image: budget-intelligence-web:local
    build:
      context: apps/web
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api

volumes:
  budget-postgres-data:
